# RETROWP.CFG -- RetroWP startup configuration
#
# Lives at C:\RETROWP.CFG and is read ONCE at startup; changes take
# effect on the next launch. A missing file is normal and not an error --
# every setting below has a documented default and RetroWP runs fine with
# no config file at all.
#
# Format:  key=value, one per line.  Lines starting with # or ; are
# comments.  Blank lines are ignored.  Keys and values are
# case-insensitive.  Either CRLF or LF line endings work.
#
# The parser is deliberately forgiving: an unknown key, an unknown value
# or a malformed line is skipped rather than treated as an error. That is
# what makes the "not yet implemented" section at the bottom safe to
# leave in place -- those keys do nothing today and harm nothing.


# ===================================================================
# ACTIVE SETTINGS
# ===================================================================

# keymap -- which keybinding scheme the editor uses.
#
#   vi            modal editing: NORMAL/INSERT/VISUAL, :w :q, dd, d3j
#   wordstar      the classic ^K/^Q diamond (WordStar, Turbo Pascal)
#   emacs         ^A ^E ^K ^Y, M-f M-b
#   wordperfect   F-key driven; F1 is Help there, not Cancel
#   msword        Word-style ^B ^I ^U, ^S save
#
# Default: vi
#
# Printable reference cards for every scheme: make keycards
# Full tables and the HELP/UNDO key notes: docs/keymaps.md

keymap=vi


# ===================================================================
# NOT YET IMPLEMENTED -- documented here as the intended shape
# ===================================================================
#
# Everything below is INERT. The keys are ignored by the current build;
# they are written down so the settings dialog and the config writer
# (tasks #183/#184) have a spec to implement rather than invent, and so
# the file format does not change under anyone later.
#
# Measurements are in TWIPS, the unit the document model itself uses:
#   1 inch = 1440 twips     1 point = 20 twips     1 cm = 567 twips
# A friendlier "1in" / "2.54cm" / "12pt" form is worth adding when these
# are actually parsed.

# --- Page geometry (engine defaults: US Letter, 1in margins) --------
#page_width=12240        # 8.5in.  A4 would be 11907
#page_height=15840       # 11in.   A4 would be 16839
#margin_left=1440        # 1in
#margin_right=1440       # 1in
#margin_top=1440         # 1in
#margin_bottom=1440      # 1in

# --- Default character style ---------------------------------------
# font_name empty means "whatever this machine offers" -- the ST system
# font, the Amiga Topaz, and so on. Naming a font it does not have must
# fall back to that default rather than fail.
#font_name=
#font_size=240           # 240 twips = 12pt
#bold=no
#italic=no
#underline=no

# --- Default paragraph style ---------------------------------------
#align=left             # left | center | right | justify
#indent_first=0         # first-line indent; may be negative (hanging)
#indent_left=0
#indent_right=0
#space_before=0
#space_after=0
#line_spacing=0         # 0 = single/auto

# --- Offload link (the Raspberry Pi gateway) -----------------------
# RetroWP is fully functional with no offload device attached; these
# only affect the optional link. See docs/hardware.md.
#offload=off            # off | serial
#offload_device=u:/dev/modem2   # MiNT device node, or AUX: on plain TOS
#offload_baud=19200     # 19200 is the plain-TOS BIOS ceiling (task #188)
